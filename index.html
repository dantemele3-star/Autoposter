<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gameflip Autoposter</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --console-bg: #020617;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 0; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            display: flex; 
            flex-direction: column; 
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Custom Title Bar */
        .title-bar {
            flex-shrink: 0;
            width: 100%;
            height: 40px;
            background: #020617;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0;
            box-sizing: border-box;
            -webkit-app-region: drag; 
            user-select: none;
            border-bottom: 1px solid #1e293b;
        }

        .title-left {
            display: flex;
            align-items: center;
            padding-left: 15px;
            gap: 10px;
        }

        .title-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .window-controls {
            display: flex;
            height: 100%;
            -webkit-app-region: no-drag; 
        }

        .control-btn {
            width: 46px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 14px;
            transition: background 0.2s, color 0.2s;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }
        .close-btn:hover {
            background: var(--danger);
            color: white;
        }

        .app-container { 
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 30px; 
            max-width: 850px; 
            width: 100%; 
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-color), #8b5cf6);
            border-radius: 20px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 800;
            color: white;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: -1px;
        }

        h1 { 
            margin: 0;
            font-size: 28px; 
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 5px;
        }

        .settings-grid { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(15, 23, 42, 0.5);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .option-group { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            font-size: 15px; 
            cursor: pointer;
            user-select: none;
            color: var(--text-dim);
            transition: color 0.2s;
        }
        .option-group:hover {
            color: var(--text-main);
        }

        .option-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .button-row { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 25px; 
        }

        button { 
            padding: 14px 24px; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-size: 16px; 
            border-radius: 8px; 
            font-weight: 600; 
            flex: 1; 
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #startBtn { background: var(--accent-color); }
        #startBtn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        
        #stopBtn { 
            background: var(--danger); 
            display: none; 
        }
        #stopBtn:hover { background: #dc2626; transform: translateY(-1px); }

        #logContainer { 
            flex: 1;
            min-height: 120px;
            background: var(--console-bg); 
            color: #94a3b8; 
            padding: 20px; 
            border-radius: 12px; 
            font-family: 'Cascadia Code', 'Consolas', monospace; 
            font-size: 13px; 
            overflow-y: auto; 
            white-space: pre-wrap; 
            border: 1px solid #1e293b;
            line-height: 1.6;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .log-toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        #copyLogs { flex: none; padding: 6px 12px; font-size: 12px; background: var(--panel-bg); }

        /* Custom Scrollbar */
        #logContainer::-webkit-scrollbar { width: 8px; }
        #logContainer::-webkit-scrollbar-track { background: var(--console-bg); }
        #logContainer::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        #logContainer::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <!-- Custom Title Bar -->
    <div class="title-bar">
        <div class="title-left">
            <div class="title-text">Gameflip Autoposter</div>
        </div>
        <div class="window-controls">
            <button class="control-btn" id="minWin" title="Minimize">−</button>
            <button class="control-btn" id="maxWin" title="Maximize">▢</button>
            <button class="control-btn close-btn" id="closeWin" title="Close">✕</button>
        </div>
    </div>

    <div class="app-container">
        <div class="header">
            <div class="logo-placeholder">AP</div>
            <h1>Gameflip Autoposter</h1>
            <div class="subtitle">Automated Draft-to-Live Listing Tool</div>
        </div>

        <div class="settings-grid">
            <label class="option-group">
                <input type="checkbox" id="randomize">
                <span>Post in Random Order</span>
            </label>
            <label class="option-group">
                <input type="checkbox" id="headless">
                <span>Hidden Mode (Headless)</span>
            </label>
            <label class="option-group">
                <input type="checkbox" id="loop">
                <span>Continuous Loop</span>
            </label>
            <label class="option-group">
                <input type="checkbox" id="maintainLimit">
                <span>Delete Oldest Listing (Maintain Count)</span>
            </label>
        </div>
        
        <div class="button-row">
            <button id="startBtn"><span>▶</span> Start Posting</button>
            <button id="stopBtn"><span>🛑</span> Stop Posting</button>
        </div>
        
        <div class="log-toolbar"><button id="copyLogs">Copy Logs</button></div>
        <div id="logContainer" role="log">Ready to launch...</div>
    </div>

    <script>
        const { ipcRenderer, clipboard } = require('electron');

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const logContainer = document.getElementById('logContainer');
        const settings = [...document.querySelectorAll('.settings-grid input')];
        document.getElementById('copyLogs').addEventListener('click', event => {
            clipboard.writeText(logContainer.innerText);
            event.currentTarget.textContent = 'Copied';
            setTimeout(() => document.getElementById('copyLogs').textContent = 'Copy Logs', 2000);
        });

        // Window Controls
        document.getElementById('minWin').addEventListener('click', () => ipcRenderer.send('window-minimize'));
        document.getElementById('maxWin').addEventListener('click', () => ipcRenderer.send('window-maximize'));
        document.getElementById('closeWin').addEventListener('click', () => ipcRenderer.send('window-close'));

        function appendLog(msg) {
            const timestamp = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            logContainer.innerText += `[${timestamp}] ${msg}\n`;
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        ipcRenderer.on('log-message', (event, message) => {
            appendLog(message);
        });

        startBtn.addEventListener('click', async () => {
            logContainer.innerText = "🚀 Initializing Ghost Session... Please wait.\n";
            startBtn.style.display = "none";
            stopBtn.style.display = "block";
            settings.forEach(input => input.disabled = true);

            const config = {
                randomize: document.getElementById('randomize').checked,
                headless: document.getElementById('headless').checked,
                loop: document.getElementById('loop').checked,
                maintainLimit: document.getElementById('maintainLimit').checked
            };

            try {
                const result = await ipcRenderer.invoke('process-drafts', config);
                if (result.success) {
                    appendLog(`\n✅ COMPLETED! Total items listed: ${result.postedCount}`);
                } else {
                    appendLog(`\n❌ Posting paused after ${result.postedCount || 0} confirmed posts: ${result.error}`);
                }
            } catch (err) {
                appendLog(`\n❌ System Error: ${err.message}`);
            } finally {
                startBtn.style.display = "block";
                stopBtn.style.display = "none";
                settings.forEach(input => input.disabled = false);
            }
        });

        stopBtn.addEventListener('click', async () => {
            appendLog("\n🛑 Stop signal sent. Finishing current item...");
            try {
                await ipcRenderer.invoke('stop-drafts');
            } catch (err) {
                console.error("Failed to send stop signal:", err);
            }
        });
    </script>
</body>
</html>
